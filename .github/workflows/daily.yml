name: Daily edition

on:
  schedule:
    # Fallback only. The hopefully-true-daily Cloudflare Worker is the primary
    # trigger: it fires at 02:37 and 03:37 UTC and dispatches this workflow
    # when Zurich local time is 04:xx, so the edition starts at 04:37
    # Europe/Zurich all year. GitHub cron can run hours late, so keep these
    # entries as a backup; the "already published" step below skips generate
    # if today's edition is already in content/ or another run has started.
    - cron: '37 2 * * *'   # 04:37 CEST (summer, UTC+2)
    - cron: '37 3 * * *'   # 04:37 CET (winter, UTC+1)
  workflow_dispatch:
    inputs:
      generate:
        description: 'Generate new articles (untick to just rebuild and deploy)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-edition
  cancel-in-progress: false

env:
  PAGES_PROJECT: hopefully-true
  PAGES_DOMAIN: hopefullytrue.com

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # its secrets are only available to runs on main
    steps:
      - name: Zurich-hour guard
        id: guard
        run: |
          off=$(TZ=Europe/Zurich date +%z)
          run=true
          # Only the scheduled fallback is offset-filtered. A Worker dispatch
          # is workflow_dispatch, so it is never skipped by this guard.
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "${{ github.event.schedule }}" = '37 2 * * *' ] && [ "$off" != +0200 ]; then run=false; fi
            if [ "${{ github.event.schedule }}" = '37 3 * * *' ] && [ "$off" != +0100 ]; then run=false; fi
          fi
          echo "Zurich offset $off, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.run == 'true'
        with:
          persist-credentials: false # only the commit step below gets the write token

      - name: Skip generate if today's edition already exists
        id: already
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Europe/Zurich date +%F)
          want=false
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.generate }}" = true ]; then
            want=true
          fi
          if [ "$want" = true ] && [ -f "content/stories/${today}.json" ]; then
            echo "Today's edition already exists (content/stories/${today}.json); skipping generate"
            want=false
          fi
          if [ "$want" = true ]; then
            this="${{ github.run_id }}"
            while IFS=$'\t' read -r id status created; do
              [ -n "$id" ] || continue
              [ "$id" = "$this" ] && continue
              created_day=$(TZ=Europe/Zurich date -d "$created" +%F)
              [ "$created_day" = "$today" ] || continue
              case "$status" in
                in_progress|queued|waiting|pending|requested)
                  echo "Another daily run ($id, $status) already started today; skipping generate"
                  want=false
                  break
                  ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/runs?per_page=20" --jq '.workflow_runs[] | [.id,.status,.created_at] | @tsv')
          fi
          echo "generate=$want"
          echo "generate=$want" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Check the README shows the current prompts
        if: steps.guard.outputs.run == 'true'
        run: npm run check

      - name: Generate today's articles
        id: generate
        if: steps.guard.outputs.run == 'true' && steps.already.outputs.generate == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: npm run daily

      # Persist whatever was generated, even if a later step fails, so paid-for articles are never lost.
      - name: Commit new articles
        if: always() && steps.guard.outputs.run == 'true' && steps.generate.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add content
          if git diff --cached --quiet; then echo "no new content"; exit 0; fi
          git config user.name 'hopefully-true-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Edition $(TZ=Europe/Zurich date +%F) [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      # Only reached if generation succeeded (or was skipped on purpose): a failed run never deploys.
      - name: Build site
        if: steps.guard.outputs.run == 'true'
        env:
          SITE_URL: https://${{ env.PAGES_DOMAIN }}
        run: |
          node src/build-site.mjs out
          test -s out/index.html
          test "$(ls out/a | wc -l)" -ge 1

      - name: Ensure Pages project and custom domain
        if: steps.guard.outputs.run == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/$PAGES_PROJECT")
          if [ "$code" = 404 ]; then
            curl -fsS "${auth[@]}" -X POST "$api" -d "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" -o /dev/null
            echo "created Pages project $PAGES_PROJECT"
          elif [ "$code" != 200 ]; then echo "Pages API returned $code (check the token)"; exit 1; fi
          if ! curl -fsS "${auth[@]}" "$api/$PAGES_PROJECT/domains" | grep -q "\"$PAGES_DOMAIN\""; then
            curl -fsS "${auth[@]}" -X POST "$api/$PAGES_PROJECT/domains" -d "{\"name\":\"$PAGES_DOMAIN\"}" -o /dev/null
            echo "added custom domain $PAGES_DOMAIN"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.run == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
